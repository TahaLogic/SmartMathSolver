<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smart Math Solver</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { padding: 12px 25px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 8px; }
        #status { color: red; margin: 10px 0; padding: 10px; display: none; background: #fff5f5; border: 1px solid red; }
    </style>
</head>
<body>

    <input type="password" id="apiKeyInput" placeholder="کلید API را اینجا وارد کنید">
    <input type="text" id="question" placeholder="سوال ریاضی...">
    <button onclick="solveMath()">حل کن</button>

    <div id="status"></div>
    <div id="result"></div>

<script>
    async function solveMath() {
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const apiKey = document.getElementById('apiKeyInput').value;
        const question = document.getElementById('question').value;

        statusDiv.style.display = 'none';
        resultDiv.innerText = 'در حال ارتباط با سرور...';

        try {
            // تغییر مهم: استفاده از v1 به جای v1beta
            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Solve this math problem: " + question }] }]
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error ? errorData.error.message : 'خطای ناشناخته');
            }

            const data = await response.json();
            resultDiv.innerText = data.candidates[0].content.parts[0].text;

        } catch (error) {
            statusDiv.style.display = 'block';
            statusDiv.innerText = "خطا: " + error.message;
            resultDiv.innerText = '';
        }
    }
</script>
</body>
</html>
