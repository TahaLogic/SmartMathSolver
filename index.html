<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دستیار ریاضی ارباب</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>حل‌کننده هوشمند ریاضی</h2>
    <textarea id="question" placeholder="سوال ریاضی‌ت رو اینجا بنویس..."></textarea>
    <button onclick="solveMath()">حل کن!</button>
    <div id="result" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        // این تابع هیچ کلیدی رو تو خودش نگه نمی‌داره!
        async function solveMath() {
            const question = document.getElementById('question').value;
            const resultDiv = document.getElementById('result');

            if (!question) {
                alert("سوال رو ننوشتی که ارباب!");
                return;
            }

            // کلید رو در لحظه ازت می‌پرسه
            const apiKey = prompt("ارباب، کلید API رو وارد کن (فقط برای این نشست استفاده می‌شه):");

            if (!apiKey) {
                alert("بدون کلید که نمی‌شه، باید واردش کنی!");
                return;
            }

            resultDiv.innerText = "درحال فکر کردن...";

            try {
                // آدرس API گوگل جمینای
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "این سوال ریاضی رو حل کن: " + question }] }]
                    })
                });

                const data = await response.json();
                const answer = data.candidates[0].content.parts[0].text;
                resultDiv.innerText = "پاسخ: " + answer;

            } catch (error) {
                resultDiv.innerText = "خطا رخ داد! مطمئنی کلیدت درسته؟";
                console.error(error);
            }
        }
    </script>
</body>
</html>
