DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartMathSolver | حل‌کننده هوشمند</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 90%; max-width: 400px; text-align: center; }
        h1 { margin-bottom: 1.5rem; color: var(--primary); }
        input { width: 100%; padding: 15px; border-radius: 10px; border: none; margin-bottom: 15px; font-size: 1.2rem; background: #334155; color: white; box-sizing: border-box; }
        
        /* نوار ابزار جدید */
        .math-tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .tool-btn { background: #475569; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tool-btn:active { background: var(--primary); }

        button.solve-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-size: 1.1rem; cursor: pointer; }
        #result { margin-top: 20px; font-size: 1.5rem; font-weight: bold; min-height: 2rem; }
        .footer { margin-top: 30px; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>SmartMathSolver</h1>
    
    <!-- نوار ابزار اضافه شده -->
    <div class="math-tools">
        <button class="tool-btn" onclick="insert('Math.sqrt(')">√</button>
        <button class="tool-btn" onclick="insert('**')">^</button>
        <button class="tool-btn" onclick="insert('(')">(</button>
        <button class="tool-btn" onclick="insert(')')">)</button>
        <button class="tool-btn" onclick="insert('Math.PI')">π</button>
        <button class="tool-btn" onclick="insert('Math.sin(')">sin</button>
        <button class="tool-btn" onclick="insert('Math.cos(')">cos</button>
        <button class="tool-btn" onclick="insert('/')">÷</button>
    </div>

    <input type="text" id="mathInput" placeholder="عبارت ریاضی را وارد کنید..." autocomplete="off">
    <button class="solve-btn" onclick="calculate()">محاسبه</button>
    <div id="result"></div>
    
    <div class="footer">
        Designed by TahaLogic | قدرت گرفته از موتور هوشمند
    </div>
</div>

<script>
    function insert(symbol) {
        const input = document.getElementById('mathInput');
        input.value += symbol;
        input.focus();
    }

    function calculate() {
        const expression = document.getElementById('mathInput').value;
        const resultDiv = document.getElementById('result');
        try {
            // استفاده از brainEngine برای محاسبه
            const result = new Function('return ' + expression)();
            resultDiv.innerText = "جواب: " + result;
        } catch (e) {
            resultDiv.innerText = "خطا در فرمول!";
        }
    }
