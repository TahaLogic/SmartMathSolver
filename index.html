<script>
    function solve() {
        let input = document.getElementById('mathInput').value;
        let resultDiv = document.getElementById('result');

        // این "مغزِ متفکرِ" بومیِ ماست که کم‌کم قراره بزرگترش کنیم
        const brainEngine = (expression) => {
            // مرحله اول: پالایش (سخت‌گیری روی ورودی برای امنیت)
            // فقط اعداد و عملگرهای ریاضی رو قبول می‌کنیم
            const clean = expression.replace(/[^0-9+\-*/().]/g, '');
            
            // مرحله دوم: محاسبه (هسته منطقی)
            // ما اینجا داریم با ساختار "Function" یک مفسرِ بومی می‌سازیم
            return new Function(`return ${clean}`)();
        };

        if(input) {
            try {
                // شروع پردازش هوش مصنوعی
                let answer = brainEngine(input);
                resultDiv.innerHTML = `ارباب، هوش مصنوعیِ بومیِ شما به این نتیجه رسید: <b>${answer}</b>`;
            } catch(err) {
                resultDiv.innerText = "ارباب، عبارتت کمی عجیبه! انگار هنوز در سطحِ درکِ هوشِ مصنوعیِ ما نیست.";
            }
        } else {
            resultDiv.innerText = "خب خالی که نمیشه! یه معادله‌ای، چیزی وارد کن.";
        }
    }
</script>
