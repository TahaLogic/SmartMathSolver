<!DOCTYPE html>
<html>
<body>
    <h3>تستِ اتصال به گوگل</h3>
    <input type="password" id="apiKey" placeholder="کلید API خود را اینجا وارد کن">
    <button onclick="checkConnection()">تستِ اتصال</button>
    <p id="result"></p>

    <script>
        async function checkConnection() {
            const key = document.getElementById('apiKey').value;
            const resDisplay = document.getElementById('result');
            resDisplay.innerText = "در حال بررسی...";

            try {
                // این آدرس، لیستِ مدل‌های موجود را می‌گیرد. اگر کلید سالم باشد، لیست را برمی‌گرداند.
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await response.json();

                if (response.ok) {
                    resDisplay.style.color = "green";
                    resDisplay.innerText = "عالی! اتصال برقرار است. کلیدت کاملاً سالمه.";
                    console.log(data); // لیست مدل‌ها در کنسول مرورگر نمایش داده می‌شود
                } else {
                    resDisplay.style.color = "red";
                    resDisplay.innerText = "خطا! " + (data.error.message || "مشکل از اتصال است.");
                }
            } catch (error) {
                resDisplay.style.color = "red";
                resDisplay.innerText = "خطایِ شبکه: فیلترشکن را چک کن!";
            }
        }
    </script>
</body>
</html>
